<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Mergington High School</h1>
      <h2>Extracurricular Activities</h2>
      <div class="account-controls">
        <span id="account-status">Viewing as a guest</span>
        <button id="account-button" type="button" aria-label="Teacher login">
          <span aria-hidden="true">👤</span>
          <span id="account-button-label">Teacher login</span>
        </button>
      </div>
    </header>

    <main>
      <section id="activities-container">
        <h3>Available Activities</h3>
        <div id="activities-list">
          <!-- Activities will be loaded here -->
          <p>Loading activities...</p>
        </div>
      </section>

      <section id="signup-container" class="hidden">
        <h3>Sign Up for an Activity</h3>
        <form id="signup-form">
          <div class="form-group">
            <label for="email">Student Email:</label>
            <input type="email" id="email" required placeholder="your-email@mergington.edu" />
          </div>
          <div class="form-group">
            <label for="activity">Select Activity:</label>
            <select id="activity" required>
              <option value="">-- Select an activity --</option>
              <!-- Activity options will be loaded here -->
            </select>
          </div>
          <button type="submit">Sign Up</button>
        </form>
      </section>
      <section id="student-lookup-container" class="hidden">
        <h3>Student Lookup</h3>
        <form id="student-search-form" role="search">
          <div class="form-group">
            <label for="student-query">Email, student ID or name:</label>
            <input
              type="search"
              id="student-query"
              maxlength="100"
              required
              placeholder="e.g. jose, S1004 or sophia@..."
            />
          </div>
          <button type="submit">Search</button>
        </form>
        <div id="student-results" aria-live="polite"></div>
      </section>
      <div id="message" class="hidden" role="status"></div>
    </main>

    <dialog id="login-dialog">
      <form id="login-form">
        <h3>Teacher login</h3>
        <div class="form-group">
          <label for="username">Username:</label>
          <input id="username" name="username" autocomplete="username" required />
        </div>
        <div class="form-group">
          <label for="password">Password:</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
          />
        </div>
        <div id="login-error" class="error hidden" role="alert"></div>
        <div class="dialog-actions">
          <button type="button" id="cancel-login" class="secondary-button">Cancel</button>
          <button type="submit">Log in</button>
        </div>
      </form>
    </dialog>

    <footer>
      <p>&copy; 2026 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
